packages:
  - 'packages/*'

# Supply-chain hardening: require third-party package versions to be at
# least 3 days old before pnpm will install them. Internal @n-dx/* workspace
# packages are exempt so cross-workspace installs aren't blocked by their
# own publish recency.
minimumReleaseAgeStrict: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@n-dx/*'

trustPolicy: no-downgrade

# Moved here from package.json's "pnpm.overrides" — pnpm 10.33 no longer
# reads that field (warns "The 'pnpm' field in package.json is no longer
# read by pnpm" on every install), so these had been silently inactive.
# undici-types pin: @types/node@22.19.8 (used by hench/llm-client/rex,
# pinned to @types/node@^22.0.0) requires undici-types@~6.21.0, and 6.21.0
# has no provenance attestation while later 6.x versions do -- trips
# trustPolicy: no-downgrade above (ERR_PNPM_TRUST_DOWNGRADE). undici-types
# is types-only (no runtime code), so forcing a newer compatible version
# here is safe. Pinned to 6.28.0, the newest version with SLSA provenance
# confirmed via `npm view undici-types@6.28.0 dist.attestations`.
overrides:
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  postcss: ^8.5.10
  hono: ^4.12.18
  fast-uri: '>=3.1.2'
  '@hono/node-server': ^1.19.13
  ajv@>=7.0.0-alpha.0 <8.18.0: ^8.18.0
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  qs@>=6.7.0 <6.14.2: ^6.14.2
  vite@>=7.0.0 <7.3.2: ^7.3.2
  esbuild@<0.25.0: ^0.25.0
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  vite@<6.4.2: ^6.4.2
  ip-address@<10.1.1: ^10.1.1
  undici-types: ^6.28.0
